apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: writetimeout
  namespace: default

spec:
  writeTimeout:
    timeout: 42s

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test.route
  namespace: default

spec:
  entryPoints:
    - web

  routes:
    - match: Host(`foo.com`) && PathPrefix(`/events`)
      priority: 12
      kind: Rule
      services:
        - name: whoami
          port: 80
      middlewares:
        - name: writetimeout
